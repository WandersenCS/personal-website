name: Update Hugo Theme

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Update theme module and npm dependencies
        run: |
          hugo mod get -u github.com/schnerring/hugo-theme-gruvbox github.com/schnerring/hugo-mod-json-resume
          hugo mod tidy
          hugo mod npm pack
          npm install

      - name: Verify updated site builds
        run: hugo --gc --minify --environment production --baseURL "https://wandersen.dev/"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-hugo-theme-gruvbox
          delete-branch: true
          commit-message: Updates hugo-theme-gruvbox
          title: Updates hugo-theme-gruvbox
          body: Automated Hugo module and npm dependency update for hugo-theme-gruvbox.
