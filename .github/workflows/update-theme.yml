name: Update Hugo Theme

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-hugo-theme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Update theme module and npm dependencies
        id: update
        shell: bash
        env:
          # Let Go fetch the toolchain required by a newly updated module.
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail

          hugo mod get -u github.com/schnerring/hugo-theme-gruvbox github.com/schnerring/hugo-mod-json-resume
          hugo mod tidy
          hugo mod npm pack
          npm install --no-audit --no-fund

          pr_body="$RUNNER_TEMP/update-theme-pr-body.md"
          node --test scripts/update-npm-dependencies.test.mjs
          node scripts/update-npm-dependencies.mjs "$pr_body"
          echo "pr_body_path=$pr_body" >> "$GITHUB_OUTPUT"

      - name: Verify updated site builds
        run: hugo --gc --minify --environment production --baseURL "https://wandersen.dev/"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-hugo-theme-gruvbox
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
            package-lock.json
            package.json
            package.hugo.json
            packages/hugoautogen/package.json
            packages/hugoautogen/hugo_packagemeta.json
          commit-message: Update Hugo modules and npm dependencies
          title: Update Hugo modules and npm dependencies
          body-path: ${{ steps.update.outputs.pr_body_path }}
