baseURL = "https://wandersen.dev/"
defaultContentLanguage = "en"
disableDefaultLanguageRedirect = true
locale = "en-us"
title = "Will Andersen"
copyright = "Copyleft 🄯 2026 Will Andersen"
enableRobotsTXT = true
mainSections = []
disableKinds = ["taxonomy", "term"]

[build]
  _merge = "deep"
  noJSConfigInAssets = true
  [build.buildStats]
    enable = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["html", "searchIndex"]

[outputFormats]
  [outputFormats.searchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[params]
  author = "Will Andersen"
  subtitle = "Software Engineer"
  description = "Personal website of Will Andersen."
  defaultTheme = "dark"
  themeColor = "green"
  themeContrast = "medium"

  [params.logo]
    text = "wandersen.dev"
    url = "/"

  [params.prism]
    languages = ["markup", "css", "clike", "javascript", "bash", "toml"]
    plugins = ["normalize-whitespace", "toolbar", "copy-to-clipboard"]

  [params.tagCloud]
    enable = false
    minFontSizeRem = 0.8
    maxFontSizeRem = 2.0

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 10
    [[languages.en.menu.main]]
      identifier = "home"
      name = "Home"
      url = "/"
      weight = 1
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 10
    [languages.en.params.jsonResume]
      present = "present"
  [languages.de]
    label = "Deutsch"
    locale = "de-at"
    weight = 20
    [[languages.de.menu.main]]
      identifier = "home"
      name = "Start"
      url = "/"
      weight = 1
    [[languages.de.menu.main]]
      identifier = "about"
      name = "Über"
      url = "/about/"
      weight = 10
    [languages.de.params.jsonResume]
      present = "heute"
  [languages.fr]
    label = "Français"
    locale = "fr-fr"
    weight = 30
    [[languages.fr.menu.main]]
      identifier = "home"
      name = "Accueil"
      url = "/"
      weight = 1
    [[languages.fr.menu.main]]
      identifier = "about"
      name = "À propos"
      url = "/about/"
      weight = 10
    [languages.fr.params.jsonResume]
      present = "présent"

[module]
  [[module.imports]]
    path = "github.com/schnerring/hugo-theme-gruvbox"
  [[module.imports]]
    path = "github.com/schnerring/hugo-mod-json-resume"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "assets/css/json-resume.css"
      target = "assets/css/critical/44-json-resume.css"
  [[module.mounts]]
    source = "node_modules/simple-icons/icons"
    target = "assets/simple-icons"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "node_modules/prismjs"
    target = "assets/prismjs"
  [[module.mounts]]
    source = "node_modules/prism-themes/themes"
    target = "assets/prism-themes"
  [[module.mounts]]
    source = "node_modules/typeface-fira-code/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/typeface-roboto-slab/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/@tabler/icons/icons"
    target = "assets/tabler-icons"
  [[module.mounts]]
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"
